# TripRescue — installed at /etc/nginx/sites-available/__DOMAIN__ and symlinked
# into sites-enabled/. Plain :80 on purpose: `certbot --nginx -d __DOMAIN__`
# rewrites this file with the TLS block and the :80 redirect once DNS resolves.
server {
    server_name __DOMAIN__;
    listen 80;
    listen [::]:80;

    client_max_body_size 64k;

    location / {
        proxy_pass http://127.0.0.1:3040;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The app derives the Secure cookie flag and its same-origin check from this.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }
}
